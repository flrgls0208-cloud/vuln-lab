<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
</head>
<body>
    <h2>게시판 목록</h2>
    <a href="{{ url_for('board.board_write') }}">글쓰기</a>
    <hr>
    <ul>
        {% for post in posts %}
            <li>
                <a href="{{ url_for('board.board_view', post_id=post.id) }}">{{ post.title }}</a>
                (작성자: {{ post.author }})
            </li>
        {% else %}
            <li>등록된 게시글이 없습니다.</li>
        {% endfor %}
    </ul>
    <a href="{{ url_for('index') }}">메인으로 돌아가기</a>
</body>
</html>
