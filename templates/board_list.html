<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>게시판 목록</title>
    <style>
        :root { --bg:#f4f7fb; --card:#fff; --txt:#0f172a; --muted:#64748b; --accent:#2563eb; --border:#e2e8f0; }
        body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background:var(--bg); color:var(--txt); }
        .wrap { max-width: 1000px; margin: 32px auto; padding: 24px; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:0 10px 24px rgba(15,23,42,0.06); padding:24px; }
        .top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
        .top h2 { margin:0; }
        .actions a, .actions button { text-decoration:none; padding:10px 14px; border-radius:999px; background:var(--accent); color:#fff; border:none; cursor:pointer; }
        .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
        .toolbar input, .toolbar select { padding:9px 10px; border:1px solid var(--border); border-radius:8px; }
        .post-item { border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px; background:#fbfdff; }
        .post-item a.title { font-weight:700; color:var(--txt); text-decoration:none; font-size:16px; }
        .meta { color:var(--muted); font-size:13px; margin-top:6px; }
        .empty { padding:14px; color:var(--muted); }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="card">
            <div class="top">
                <h2>커뮤니티 게시판</h2>
                <div class="actions">
                    <a href="{{ url_for('board.board_write') }}">글쓰기</a>
                    <a href="{{ url_for('index') }}">홈으로</a>
                </div>
            </div>

            <div class="toolbar">
                <form method="GET" action="{{ url_for('board.board_list') }}" style="display:flex; gap:8px; flex-wrap:wrap;">
                    <input type="text" name="q" value="{{ search_query }}" placeholder="검색어 입력">
                    <select name="filter">
                        <option value="all" {% if filter_type == 'all' %}selected{% endif %}>전체</option>
                        <option value="title" {% if filter_type == 'title' %}selected{% endif %}>제목</option>
                        <option value="content" {% if filter_type == 'content' %}selected{% endif %}>내용</option>
                        <option value="author" {% if filter_type == 'author' %}selected{% endif %}>작성자</option>
                    </select>
                    <button type="submit">검색</button>
                </form>
            </div>

            {% for post in posts %}
                <div class="post-item">
                    <a class="title" href="{{ url_for('board.board_view', post_id=post.id) }}">{{ post.title }}</a>
                    <div class="meta">
                        작성자: {{ post.user.username if post.user else '알 수 없음' }} |
                        작성일: {{ post.created_at.strftime('%Y-%m-%d %H:%M') if post.created_at else '-' }} |
                        첨부: {% if post.image_path %}<a href="{{ url_for('board.board_download', post_id=post.id) }}">다운로드</a>{% else %}없음{% endif %}
                    </div>
                </div>
            {% else %}
                <div class="empty">등록된 게시글이 없습니다.</div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
