<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - vuln-lab</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; }
        input { width: 100%; padding: 10px; margin: 6px 0 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #333; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #555; }
        .flash { color: #c0392b; font-size: 14px; margin-bottom: 10px; }
        .link { margin-top: 12px; font-size: 14px; text-align: center; }
        .link a { color: #333; }
    </style>
</head>
<body>
    <div class="box">
        <h2>회원가입</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label>아이디</label>
            <input type="text" name="username" required autofocus>
            <label>비밀번호</label>
            <input type="password" name="password" required>
            <button type="submit">가입하기</button>
        </form>
        <div class="link">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></div>
    </div>
</body>
</html>
