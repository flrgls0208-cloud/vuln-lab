<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - vuln-lab</title>
    <style>
        :root { --bg:#f4f7fb; --card:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --accent:#2563eb; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fafc);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .box {
            width: min(400px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(15,23,42,0.08);
            padding: 28px;
        }
        h2 { margin: 0 0 8px; font-size: 24px; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input {
            width: 100%; padding: 11px 12px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px;
        }
        .password-wrap { position: relative; }
        .password-wrap input { padding-right: 12px; }
        .toggle-row { display: flex; align-items: center; gap: 6px; margin: -4px 0 12px; font-size: 13px; color: var(--muted); }
        .toggle-row input[type="checkbox"] { width: auto; margin: 0; accent-color: var(--accent); }
        button {
            width: 100%; padding: 12px 14px; background: var(--accent); color: #fff; border: none; border-radius: 999px; cursor: pointer; font-weight: 700;
        }
        button:hover { filter: brightness(1.05); }
        .flash { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .link { margin-top: 14px; font-size: 14px; text-align: center; color: var(--muted); }
        .link a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>회원가입</h2>
        <div class="sub">새 계정을 만들어 커뮤니티를 시작하세요.</div>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}
                    <div class="flash">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <label>아이디</label>
            <input type="text" name="username" required autofocus>
            <label>비밀번호</label>
            <div class="password-wrap">
                <input type="password" id="password" name="password" required>
            </div>
            <label class="toggle-row" for="show_password">
                <input type="checkbox" id="show_password" onchange="togglePasswordVisibility('password', this.checked)">
                비밀번호 보기
            </label>
            <label>비밀번호 확인</label>
            <div class="password-wrap">
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <label class="toggle-row" for="show_confirm_password">
                <input type="checkbox" id="show_confirm_password" onchange="togglePasswordVisibility('confirm_password', this.checked)">
                비밀번호 확인 보기
            </label>
            <button type="submit">가입하기</button>
        </form>
        <div class="link">이미 계정이 있으신가요? <a href="{{ url_for('auth.login') }}">로그인</a></div>
    </div>
    <script>
        function togglePasswordVisibility(targetId, show) {
            var input = document.getElementById(targetId);
            if (!input) return;
            input.type = show ? 'text' : 'password';
        }
    </script>
</body>
</html>
